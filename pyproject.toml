[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vapomon"
version = "0.1.0"
description = "CLI to read the temperature from Storz & Bickel Bluetooth vaporizers"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["bleak>=0.21"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vapomon = "vapomon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vapomon"]
